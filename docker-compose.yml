services:
  postgres:
    image: postgres:16-alpine
    container_name: rtm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rtm_user
      POSTGRES_PASSWORD: rtm_password
      POSTGRES_DB: rtm_db
    ports:
      - "5433:5432"
    volumes:
      - rtm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtm_user -d rtm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rtm_pg_data:
